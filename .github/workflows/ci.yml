name: ARES CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

env:
  ARES_SECRET_KEY: "ci-secret-key-placeholder-min32chars!!"
  ARES_ENCRYPTION_KEY: "ci-encryption-key-placeholder-32chars"
  ARES_DEFAULT_ADMIN_PASSWORD: "CiAdmin1!-placeholder-secret99"

jobs:
  backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall ares tests
      - run: pytest tests/unit -q --tb=short --timeout=60 --timeout-method=thread --maxfail=1

  postgres:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ares_ci_runner
          POSTGRES_DB: ares_ci_control
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready --username=ares_ci_runner --dbname=ares_ci_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ARES_TEST_POSTGRES_HOST: 127.0.0.1
      ARES_TEST_POSTGRES_USER: ares_ci_runner
      ARES_TEST_POSTGRES_DB: ares_ci_control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,postgres]"
      - env:
          ARES_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: >-
          pytest tests/integration/test_postgres_*.py
          -q --tb=short --timeout=60 --timeout-method=thread --maxfail=1
          --basetemp="${{ runner.temp }}/ares-postgres-pytest"

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
